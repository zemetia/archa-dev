name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The app ships for Windows; ubuntu keeps core / CLI honest off Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No test launches Electron; skip the ~100 MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # onnxruntime-node's postinstall would fetch CUDA EP binaries on Linux; tests never load it.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (pnpm@9.15.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm docs:check
